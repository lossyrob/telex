[package]
name = "station-core"
version = "0.0.0"
edition = "2021"
publish = false
description = "Prototype-only Telex Station engine (UI-independent)"

[lib]
name = "station_core"
path = "src/lib.rs"

[[bin]]
name = "station-headless"
path = "src/bin/station-headless.rs"

[dependencies]
telex = { path = "../../..", default-features = false, features = ["sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"

[features]
default = []
postgres = ["telex/postgres"]
