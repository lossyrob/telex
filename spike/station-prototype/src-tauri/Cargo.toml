[package]
name = "telex-station-prototype"
version = "0.0.0"
edition = "2021"
publish = false
description = "Prototype-only Telex Station desktop shell"

[[bin]]
name = "telex-station"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
station-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "telex_station_prototype"
path = "src/lib.rs"
