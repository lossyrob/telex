name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

# No workflow-level write permission: only the publish job needs `contents: write`
# (least privilege). build/verify-version run with the default read-only token.

jobs:
  verify-version:
    name: Verify tag matches Cargo.toml version
    # Guards the #1 predicted release incident: a vX.Y.Z tag shipping a binary that
    # self-identifies as a different version (breaks upgrade tooling / the downstream
    # release-upgrade node). Only runs on real tag pushes; a workflow_dispatch (even
    # if pointed at a tag ref) is a build-only dry-run and never reaches publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare tag to Cargo.toml version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # Read [package].version specifically, so a future [workspace.package]
          # block cannot shadow it.
          crate="$(awk '/^\[/{inpkg=0} /^\[package\]/{inpkg=1} inpkg && /^version[[:space:]]*=/{gsub(/["[:space:]]/,"",$0); sub(/^version=/,""); print; exit}' Cargo.toml)"
          if [ -z "${crate}" ]; then
            echo "::error::could not read [package].version from Cargo.toml"
            exit 1
          fi
          if [ "${tag}" != "${crate}" ]; then
            echo "::error::release tag v${tag} does not match Cargo.toml version ${crate}; bump Cargo.toml (and Cargo.lock) before tagging"
            exit 1
          fi
          echo "release tag v${tag} matches Cargo.toml version ${crate}"
          # A hyphen in build metadata alone does not make a SemVer prerelease.
          case "${crate%%+*}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    # Runs in parallel with verify-version (and on workflow_dispatch, where
    # verify-version is skipped). A mismatched tag still cannot publish because the
    # publish job needs verify-version to succeed; the only cost is a wasted build.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute asset version
        id: ver
        shell: bash
        run: |
          # github.ref_name is the tag on a release (vX.Y.Z) or the branch on a
          # workflow_dispatch dry-run (which may contain '/'). Sanitize '/' -> '-' so
          # asset paths are always valid; on a real tag push this is a no-op.
          echo "v=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          crate="$(awk '/^\[/{inpkg=0} /^\[package\]/{inpkg=1} inpkg && /^version[[:space:]]*=/{gsub(/["[:space:]]/,"",$0); sub(/^version=/,""); print; exit}' Cargo.toml)"
          test -n "$crate"
          echo "candidate_tag=v${crate}" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install Linux TLS dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build release binary
        # Batteries-included published binary: all backends + Entra auth.
        env:
          TELEX_BUILD_ID: ${{ github.sha }}
        run: cargo build --release --target ${{ matrix.target }} --features entra

      - name: Build Windows x64 Watcher
        # No macOS containment support or native Windows ARM Watcher proof yet.
        # Linux packaging remains Telex-only (Watcher also needs its process guard).
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          TELEX_BUILD_ID: ${{ github.sha }}
        run: >-
          cargo build --release --locked --target ${{ matrix.target }}
          -p telex-watcher --no-default-features --features sqlite,postgres,entra
          --bin telex-watcher

      - name: Verify release binary build identity
        shell: pwsh
        run: |
          $exe = if ("${{ runner.os }}" -eq "Windows") {
            "target\${{ matrix.target }}\release\telex.exe"
          } else {
            "target/${{ matrix.target }}/release/telex"
          }
          $isolated = Join-Path $env:RUNNER_TEMP "telex-metadata-${{ matrix.target }}"
          $env:TELEX_HOME = Join-Path $isolated "home"
          $env:TELEX_CONFIG = Join-Path $isolated "config.toml"
          $env:TELEX_DB = Join-Path $isolated "store.sqlite"
          $env:TELEX_INSTALL_ROOT = Join-Path $isolated "install"
          $env:TELEX_LAUNCHER_ACTIVE = "1"
          $metadata = & $exe --json version | ConvertFrom-Json
          if ($metadata.version.build_id -ne "${{ github.sha }}") {
            throw "release binary build_id '$($metadata.version.build_id)' does not match GITHUB_SHA '${{ github.sha }}'"
          }
          $crate = (Select-String '^version = "([^"]+)"' Cargo.toml | Select-Object -First 1).Matches.Groups[1].Value
          if ($LASTEXITCODE -ne 0 -or $metadata.version.package_version -ne $crate) {
            throw "release binary failed or package version does not match Cargo.toml"
          }
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -ne "${{ github.sha }}") {
            throw "checkout is not the workflow source SHA"
          }
          New-Item -ItemType Directory -Force evidence | Out-Null
          @{
            source_sha = "${{ github.sha }}"
            source_tree = (git rev-parse 'HEAD^{tree}')
            checkout_sha = $checkout
            workflow_run = "${{ github.run_id }}"
            workflow_attempt = "${{ github.run_attempt }}"
            target = "${{ matrix.target }}"
            features = "default + entra"
            rustc = (rustc -Vv) -join "`n"
            binary = $metadata
          } | ConvertTo-Json -Depth 20 | Set-Content evidence/build.json -Encoding utf8

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.v }}"
          $target = "${{ matrix.target }}"
          $archive = "telex-$tag-$target.zip"
          New-Item -ItemType Directory -Force -Path dist, package | Out-Null
          Copy-Item "target\$target\release\telex.exe" "package\telex.exe" -Force
          $members = @("package\telex.exe", "package\LICENSE")
          if ($target -eq "x86_64-pc-windows-msvc") {
            Copy-Item "target\$target\release\telex-watcher.exe" "package\telex-watcher.exe" -Force
            $members += "package\telex-watcher.exe"
          }
          Copy-Item "LICENSE" "package\LICENSE" -Force
          Compress-Archive -LiteralPath $members -DestinationPath "dist\$archive" -Force
          $hash = (Get-FileHash "dist\$archive" -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii -NoNewline "dist\$archive.sha256"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.v }}"
          target="${{ matrix.target }}"
          archive="telex-${tag}-${target}.tar.gz"
          mkdir -p dist package
          cp "target/${target}/release/telex" package/telex
          cp LICENSE package/LICENSE
          tar -C package -czf "dist/${archive}" telex LICENSE
          ( cd dist && shasum -a 256 "${archive}" > "${archive}.sha256" )

      - name: Install Python for isolated release proof
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prove genuine v0.1.2 upgrade and fresh installation
        shell: pwsh
        env:
          TELEX_PROOF_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tests/release_candidate.py `
            --archive "dist/telex-${{ steps.ver.outputs.v }}-${{ matrix.target }}.${{ matrix.archive }}" `
            --target "${{ matrix.target }}" --source-sha "${{ github.sha }}" `
            --tag "${{ steps.ver.outputs.candidate_tag }}" `
            --report evidence/release-proof.json
          if ($LASTEXITCODE -ne 0) { throw "native release proof failed" }

      - name: Prove macOS exit watch without parent reaping
        if: runner.os == 'macOS'
        shell: pwsh
        env:
          TELEX_BUILD_ID: ${{ github.sha }}
        run: |
          cargo test --release --locked --features entra --target ${{ matrix.target }} `
            --lib session_watch::tests::exit_watch_reports_an_unreaped_exited_child_as_exited `
            -- --exact --nocapture 2>&1 | Tee-Object -FilePath evidence/process-exit-test.log
          if ($LASTEXITCODE -ne 0) { throw "native unreaped-child exit proof failed" }

      - name: Prove native Windows observation error classification
        if: runner.os == 'Windows'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/release_windows_publication_test.py --report evidence/native-file-observer.json

      - name: Install Node for Windows bridge proof
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prove Windows inherited-profile bridge access
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tests/bridge_windows_smoke.py `
            --binary "target\${{ matrix.target }}\release\telex.exe" `
            --source-sha "${{ github.sha }}" --report evidence/bridge-windows.json
          if ($LASTEXITCODE -ne 0) { throw "Windows bridge smoke proof failed" }

      - name: Checkout genuine source-built Watcher bootstrap baseline
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/checkout@v4
        with:
          ref: 7036e7103aae4416cf0a0e2030175dc901ece893
          path: watcher-baseline-source
          persist-credentials: false

      - name: Build genuine pre-diagnostics #222 baseline
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          TELEX_BUILD_ID: 7036e7103aae4416cf0a0e2030175dc901ece893
        run: >-
          cargo build --release --locked
          --manifest-path watcher-baseline-source/Cargo.toml
          --target-dir watcher-baseline-target --target ${{ matrix.target }}
          -p telex -p telex-watcher --features telex/entra,telex-watcher/entra
          --bin telex --bin telex-watcher

      - name: Prove Windows x64 Watcher archive installation and forward upgrade
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: pwsh
        run: |
          python tests/watcher_release_archive_test.py
          if ($LASTEXITCODE -ne 0) { throw "Watcher archive fixture tests failed" }
          python tests/watcher_release_archive.py `
            --archive "dist/telex-${{ steps.ver.outputs.v }}-${{ matrix.target }}.zip" `
            --source-sha "${{ github.sha }}" `
            --baseline-root watcher-baseline-source `
            --baseline-bin-dir "watcher-baseline-target/${{ matrix.target }}/release" `
            --report evidence/watcher-archive-proof.json
          if ($LASTEXITCODE -ne 0) { throw "Watcher archive proof failed" }

      - name: Upload native release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ matrix.target }}
          path: evidence/
          if-no-files-found: error

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: telex-${{ steps.ver.outputs.v }}-${{ matrix.target }}
          path: dist/telex-${{ steps.ver.outputs.v }}-${{ matrix.target }}.${{ matrix.archive }}*
          if-no-files-found: error

  postgres-proof:
    name: Genuine release upgrade (PostgreSQL, Linux x64)
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: telex-*-x86_64-unknown-linux-gnu
          path: dist
          merge-multiple: true
      - name: Install PostgreSQL assertion client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prove both disposable PostgreSQL schema paths
        env:
          TELEX_PROOF_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tests/release_candidate.py \
            --archive "$(find dist -name '*.tar.gz' -print -quit)" \
            --target x86_64-unknown-linux-gnu --source-sha "${{ github.sha }}" \
            --tag "v$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')" \
            --postgres-url 'postgresql://postgres:postgres@127.0.0.1:5432/postgres' \
            --disposable-postgres --report evidence/postgres-release-proof.json
      - name: Upload PostgreSQL release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-postgres
          path: evidence/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify-version, build, postgres-proof]
    runs-on: ubuntu-latest
    # Only this job needs write access to create the release (least privilege).
    permissions:
      contents: write
    # Atomic publish: only after ALL matrix legs succeed, and only on a real version
    # tag PUSH. This prevents a partial, publicly-visible "Latest" release missing a
    # platform's assets (which would break that platform's installer). A
    # workflow_dispatch runs the build matrix for validation but never reaches this
    # job -- even if it is pointed at a tag ref -- because of the event_name guard.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: telex-*
          merge-multiple: true

      - name: Verify every archive has a checksum sidecar (and no orphan sidecars)
        # The in-binary `telex upgrade` release path is fail-closed: it refuses to install an
        # asset without a verified checksum. `fail_on_unmatched_files` below only asserts the
        # publish glob matched >=1 file; it does NOT guarantee every archive has a paired
        # .sha256, nor that every .sha256 has a matching archive. This step enforces both
        # directions so a packaging slip fails the release rather than stranding self-update users.
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          missing=0
          archives=(dist/telex-*.zip dist/telex-*.tar.gz)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::no release archives found under dist/"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            if [ ! -f "${archive}.sha256" ]; then
              echo "::error::missing checksum sidecar for ${archive}"
              missing=1
            fi
          done
          for sidecar in dist/telex-*.sha256; do
            archive="${sidecar%.sha256}"
            if [ ! -f "${archive}" ]; then
              echo "::error::missing archive for orphan sidecar ${sidecar}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::release archive/sidecar pairing is incomplete; refusing to publish"
            exit 1
          fi
          echo "ok: every release archive and its .sha256 sidecar are paired"

      - name: Refuse changing an already published prerelease
        if: needs.verify-version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .draft")"
          if [[ "$existing" == *false* ]]; then
            echo "::error::prerelease is already published; refusing to mutate public assets"
            exit 1
          fi

      - name: Upload all assets before publication
        id: release
        # Pin audited draft/upload/finalize semantics; v2 otherwise publishes prereleases first.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: ${{ needs.verify-version.outputs.prerelease == 'true' }}
          prerelease: ${{ needs.verify-version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.verify-version.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/telex-${{ github.ref_name }}-*

      - name: Publish the fully uploaded prerelease draft
        if: needs.verify-version.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_ID"
          draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .draft)"
          test "$draft" = true
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -F prerelease=true -f make_latest=false
