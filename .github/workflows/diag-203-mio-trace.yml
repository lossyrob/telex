# Branch-only diagnostic for #203. Removed before the fix PR is marked ready;
# never lands on main. Runs main's Windows workspace test step repeatedly with
# Mio 1.2.1 instrumented to log every tokio-rs/mio#2014 defect-state event.
name: diag-203-mio-trace

on:
  push:
    branches:
      - lossyrob-fix-watcher-lib-harness-0xc0000409
    paths:
      - .github/diag-203/mio-1.2.1-diag203.patch
      - .github/workflows/diag-203-mio-trace.yml
  workflow_dispatch:

concurrency:
  group: diag-203-mio-trace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop:
    name: mio trace (attach ${{ matrix.attach }}, shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { attach: "off", shard: 1 }
          - { attach: "off", shard: 2 }
          - { attach: "off", shard: 3 }
          - { attach: "off", shard: 4 }
          - { attach: "off", shard: 5 }
          - { attach: "off", shard: 6 }
          - { attach: "on", shard: 7 }
          - { attach: "on", shard: 8 }
    env:
      CARGO_PROFILE_DEV_DEBUG: "2"
      CARGO_PROFILE_TEST_DEBUG: "2"
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evidence root
        shell: pwsh
        run: '"DIAG203_EVIDENCE=$env:RUNNER_TEMP\diag203-evidence" >> $env:GITHUB_ENV'

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Patch in instrumented Mio 1.2.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo update -p mio --precise 1.2.1
          $src = Join-Path $env:RUNNER_TEMP "mio-src"
          New-Item -ItemType Directory -Path $src -Force | Out-Null
          $crate = Join-Path $src "mio-1.2.1.crate"
          Invoke-WebRequest -Uri "https://static.crates.io/crates/mio/mio-1.2.1.crate" -OutFile $crate
          tar -xzf $crate -C $src
          $dir = Join-Path $src "mio-1.2.1"
          $patch = Join-Path $env:RUNNER_TEMP "mio-diag203.patch"
          $text = (Get-Content -LiteralPath .github/diag-203/mio-1.2.1-diag203.patch -Raw).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patch, $text, (New-Object Text.UTF8Encoding $false))
          git -C $dir apply --verbose $patch
          if ($LASTEXITCODE -ne 0) { throw "patch failed" }
          $toml = "`n[patch.crates-io]`nmio = { path = `"$($dir.Replace('\', '/'))`" }`n"
          Add-Content -LiteralPath Cargo.toml -Value $toml
          New-Item -ItemType Directory -Path C:\diag203-mio -Force | Out-Null
          cargo tree -i mio --target all | Tee-Object -Variable tree
          if (-not (($tree -join "`n") -match [regex]::Escape($dir.Replace('\', '/')) -or ($tree -join "`n") -match [regex]::Escape($dir))) {
            throw "instrumented mio is not the resolved mio"
          }

      - name: Build
        run: cargo build --workspace --verbose

      - name: Prebuild workspace tests
        run: cargo test --workspace --no-run

      - name: Configure and verify fail-fast capture
        shell: pwsh
        run: .github/diag-203/setup-capture.ps1 -EvidenceRoot $env:DIAG203_EVIDENCE

      - name: Loop the full Windows workspace test step
        shell: pwsh
        run: >-
          .github/diag-203/run-workspace-loop.ps1 -EvidenceRoot $env:DIAG203_EVIDENCE
          -Minutes 100 -Attach ${{ matrix.attach }}
          -Label "trace-mio-1.2.1-at-${{ matrix.attach }}-${{ matrix.shard }}"

      - name: Summarize defect-state hits
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:DIAG203_EVIDENCE "mio-hits"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item C:\diag203-mio\* $out -ErrorAction SilentlyContinue
          $hits = @(Get-ChildItem $out -Filter "hits-*.log" -ErrorAction SilentlyContinue |
            ForEach-Object { Select-String -LiteralPath $_.FullName -Pattern '^=== DIAG203-HIT' })
          $kinds = $hits | ForEach-Object { if ($_.Line -match 'kind=(\S+)') { $Matches[1] } } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }
          $exes = $hits | ForEach-Object { if ($_.Line -match 'exe=(.+)$') { Split-Path -Leaf $Matches[1] } } | Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }
          $line = "mio-hits total=$($hits.Count) kinds=[$($kinds -join ' ')] exes=[$($exes -join ' ')]"
          $line | Tee-Object -FilePath (Join-Path $env:DIAG203_EVIDENCE "mio-hits.txt")
          "### $line" >> $env:GITHUB_STEP_SUMMARY

      - name: Analyze native dumps
        if: always()
        shell: pwsh
        run: .github/diag-203/analyze.ps1 -EvidenceRoot $env:DIAG203_EVIDENCE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag203-trace-at-${{ matrix.attach }}-${{ matrix.shard }}
          path: ${{ runner.temp }}\diag203-evidence
          retention-days: 14
          if-no-files-found: warn
