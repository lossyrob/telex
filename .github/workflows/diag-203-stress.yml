# Branch-only diagnostic for #203. Removed before the fix PR is marked ready;
# never lands on main. Loops the telex_watcher lib harness under CPU contention
# with Mio 1.2.1 instrumented to log tokio-rs/mio#2014 defect-state events, and
# a Mio 1.2.4 differential arm.
name: diag-203-stress

on:
  push:
    branches:
      - lossyrob-fix-watcher-lib-harness-0xc0000409
    paths:
      - .github/diag-203/run-stress-loop.ps1
      - .github/workflows/diag-203-stress.yml
  workflow_dispatch:

concurrency:
  group: diag-203-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop:
    name: stress (mio ${{ matrix.mio }}, hogs ${{ matrix.hogs }}, pageheap ${{ matrix.pageheap }}, attach ${{ matrix.attach }}, shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mio: instr-1.2.1, hogs: 6, pageheap: "off", attach: "off", shard: 1 }
          - { mio: instr-1.2.1, hogs: 6, pageheap: "off", attach: "off", shard: 2 }
          - { mio: instr-1.2.1, hogs: 6, pageheap: "off", attach: "off", shard: 3 }
          - { mio: instr-1.2.1, hogs: 6, pageheap: "off", attach: "on", shard: 4 }
          - { mio: instr-1.2.1, hogs: 6, pageheap: "off", attach: "on", shard: 5 }
          - { mio: instr-1.2.1, hogs: 6, pageheap: "on", attach: "off", shard: 6 }
          - { mio: instr-1.2.1, hogs: 0, pageheap: "off", attach: "off", shard: 7 }
          - { mio: 1.2.4, hogs: 6, pageheap: "off", attach: "off", shard: 8 }
          - { mio: 1.2.4, hogs: 6, pageheap: "off", attach: "off", shard: 9 }
    env:
      CARGO_PROFILE_DEV_DEBUG: "2"
      CARGO_PROFILE_TEST_DEBUG: "2"
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evidence root
        shell: pwsh
        run: '"DIAG203_EVIDENCE=$env:RUNNER_TEMP\diag203-evidence" >> $env:GITHUB_ENV'

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Select Mio 1.2.4
        if: matrix.mio == '1.2.4'
        run: cargo update -p mio --precise 1.2.4

      - name: Patch in instrumented Mio 1.2.1
        if: matrix.mio == 'instr-1.2.1'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo update -p mio --precise 1.2.1
          $src = Join-Path $env:RUNNER_TEMP "mio-src"
          New-Item -ItemType Directory -Path $src -Force | Out-Null
          $crate = Join-Path $src "mio-1.2.1.crate"
          Invoke-WebRequest -Uri "https://static.crates.io/crates/mio/mio-1.2.1.crate" -OutFile $crate
          tar -xzf $crate -C $src
          $dir = Join-Path $src "mio-1.2.1"
          $patch = Join-Path $env:RUNNER_TEMP "mio-diag203.patch"
          $text = (Get-Content -LiteralPath .github/diag-203/mio-1.2.1-diag203.patch -Raw).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patch, $text, (New-Object Text.UTF8Encoding $false))
          git -C $dir apply --verbose $patch
          if ($LASTEXITCODE -ne 0) { throw "patch failed" }
          Add-Content -LiteralPath Cargo.toml -Value "`n[patch.crates-io]`nmio = { path = `"$($dir.Replace('\', '/'))`" }`n"
          $tree = (cargo tree -i mio --target all) -join "`n"
          $tree
          if ($tree -notmatch [regex]::Escape($dir) -and $tree -notmatch [regex]::Escape($dir.Replace('\', '/'))) {
            throw "instrumented mio is not the resolved mio"
          }

      - name: Build
        run: cargo build --workspace --verbose

      - name: Prebuild workspace tests
        run: cargo test --workspace --no-run

      - name: Configure and verify fail-fast capture
        shell: pwsh
        run: .github/diag-203/setup-capture.ps1 -EvidenceRoot $env:DIAG203_EVIDENCE

      - name: Loop the telex_watcher lib harness
        shell: pwsh
        run: >-
          .github/diag-203/run-stress-loop.ps1 -EvidenceRoot $env:DIAG203_EVIDENCE
          -Minutes 100 -PageHeap ${{ matrix.pageheap }} -Attach ${{ matrix.attach }} -Hogs ${{ matrix.hogs }}
          -Label "stress-${{ matrix.mio }}-h${{ matrix.hogs }}-ph-${{ matrix.pageheap }}-at-${{ matrix.attach }}-${{ matrix.shard }}"

      - name: Collect all defect-state hits
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:DIAG203_EVIDENCE "mio-hits"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item C:\diag203-mio\* $out -ErrorAction SilentlyContinue
          $hits = @(Get-ChildItem $out -Filter "hits-*.log" -ErrorAction SilentlyContinue |
            ForEach-Object { Select-String -LiteralPath $_.FullName -Pattern '^=== DIAG203-HIT' })
          $exes = $hits | ForEach-Object { if ($_.Line -match 'kind=(\S+).*exe=(.+)$') { "$($Matches[1])@$(Split-Path -Leaf $Matches[2])" } } |
            Group-Object | ForEach-Object { "$($_.Name)=$($_.Count)" }
          $line = "mio-hits total=$($hits.Count) [$($exes -join ' ')]"
          $line | Tee-Object -FilePath (Join-Path $env:DIAG203_EVIDENCE "mio-hits.txt")
          "### $line" >> $env:GITHUB_STEP_SUMMARY

      - name: Analyze native dumps
        if: always()
        shell: pwsh
        run: .github/diag-203/analyze.ps1 -EvidenceRoot $env:DIAG203_EVIDENCE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag203-stress-${{ matrix.mio }}-h${{ matrix.hogs }}-ph-${{ matrix.pageheap }}-at-${{ matrix.attach }}-${{ matrix.shard }}
          path: ${{ runner.temp }}\diag203-evidence
          retention-days: 14
          if-no-files-found: warn