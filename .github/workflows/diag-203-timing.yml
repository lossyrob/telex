# Branch-only diagnostic for #203. Removed before the fix PR is marked ready;
# never lands on main. Times the opaque-legacy-state management test (whose
# 10 s timeout plus a panicking fixture Drop produced the 0xc0000409 abort)
# inside the full telex_watcher lib harness, on top of the fixture fix.
name: diag-203-timing

on:
  push:
    branches:
      - lossyrob-fix-watcher-lib-harness-0xc0000409
    paths:
      - .github/diag-203/opaque-timing.patch
      - .github/workflows/diag-203-timing.yml
  workflow_dispatch:

concurrency:
  group: diag-203-timing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loop:
    name: timing (limit ${{ matrix.limit }}s, hogs ${{ matrix.hogs }}, shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { limit: 10, hogs: 6, shard: 1 }
          - { limit: 10, hogs: 6, shard: 2 }
          - { limit: 10, hogs: 6, shard: 3 }
          - { limit: 120, hogs: 6, shard: 4 }
          - { limit: 120, hogs: 6, shard: 5 }
          - { limit: 120, hogs: 6, shard: 6 }
          - { limit: 120, hogs: 0, shard: 7 }
          - { limit: 120, hogs: 0, shard: 8 }
    env:
      CARGO_PROFILE_DEV_DEBUG: "2"
      CARGO_PROFILE_TEST_DEBUG: "2"
      CARGO_TERM_COLOR: never
      DIAG203_OPAQUE_TIMEOUT: ${{ matrix.limit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evidence root
        shell: pwsh
        run: '"DIAG203_EVIDENCE=$env:RUNNER_TEMP\diag203-evidence" >> $env:GITHUB_ENV'

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Apply timing patch and Mio 1.2.4 (job-local)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $patch = Join-Path $env:RUNNER_TEMP "opaque-timing.patch"
          $text = (Get-Content -LiteralPath .github/diag-203/opaque-timing.patch -Raw).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patch, $text, (New-Object Text.UTF8Encoding $false))
          git apply --verbose $patch
          if ($LASTEXITCODE -ne 0) { throw "patch failed" }
          cargo update -p mio --precise 1.2.4
          if ($LASTEXITCODE -ne 0) { throw "mio update failed" }

      - name: Build
        run: cargo build --workspace --verbose

      - name: Prebuild workspace tests
        run: cargo test --workspace --no-run

      - name: Configure and verify fail-fast capture
        shell: pwsh
        run: .github/diag-203/setup-capture.ps1 -EvidenceRoot $env:DIAG203_EVIDENCE

      - name: Loop the telex_watcher lib harness
        shell: pwsh
        run: >-
          .github/diag-203/run-stress-loop.ps1 -EvidenceRoot $env:DIAG203_EVIDENCE
          -Minutes 100 -PageHeap off -Attach off -Hogs ${{ matrix.hogs }}
          -Label "timing-l${{ matrix.limit }}-h${{ matrix.hogs }}-${{ matrix.shard }}"

      - name: Summarize opaque-test timing
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $env:DIAG203_EVIDENCE "opaque"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item C:\diag203-mio\opaque-*.log $out -ErrorAction SilentlyContinue
          $rows = @(Get-ChildItem $out -Filter "opaque-*.log" | Get-Content)
          $totals = $rows | ForEach-Object { if ($_ -match '"owner-joined", (\d+)') { [int]$Matches[1] } }
          $slow = @($totals | Where-Object { $_ -ge 2000 })
          $failed = @($rows | Where-Object { $_ -match 'commands_ok=false|owner_ok=false' })
          $max = ($totals | Measure-Object -Maximum).Maximum
          $line = "opaque states=$($rows.Count) max_ms=$max ge2s=$($slow.Count) timedOut=$($failed.Count)"
          $line | Tee-Object -FilePath (Join-Path $env:DIAG203_EVIDENCE "opaque.txt")
          "### $line" >> $env:GITHUB_STEP_SUMMARY
          $rows | Sort-Object { if ($_ -match '"owner-joined", (\d+)') { -[int]$Matches[1] } else { 0 } } | Select-Object -First 15 |
            ForEach-Object { $_; "    $_" >> $env:GITHUB_STEP_SUMMARY }

      - name: Analyze native dumps
        if: always()
        shell: pwsh
        run: .github/diag-203/analyze.ps1 -EvidenceRoot $env:DIAG203_EVIDENCE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag203-timing-l${{ matrix.limit }}-h${{ matrix.hogs }}-${{ matrix.shard }}
          path: ${{ runner.temp }}\diag203-evidence
          retention-days: 14
          if-no-files-found: warn