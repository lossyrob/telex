name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check embedded bridge JS syntax
        run: node --check copilot/bridge/extension.mjs

      - name: Test embedded bridge busy/idle contract
        run: node --test copilot/bridge/busy-state.test.mjs

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Linux TLS dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Complete SQLite Application Client suite
        # The public Application Client battery, the executable external
        # consumer fixture, and the isolated InstalledCurrent process proofs all
        # spawn real daemons from an isolated installed layout, so they run on
        # both OS axes with the SQLite backend selected explicitly.
        run: >-
          cargo test --no-default-features --features sqlite
          --test application_client_conformance
          --test application_client_core
          --test application_client_binding
          --test application_client_bundle
          --test application_client_fixture
          --test installed_current_process
          -- --test-threads=1

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Run Clippy over the Application Client test surface
        # Warnings-denied lint for the conformance battery, the external
        # consumer fixture harness, and the InstalledCurrent process proofs.
        run: >-
          cargo clippy --no-default-features --features sqlite
          --test application_client_conformance
          --test application_client_core
          --test application_client_binding
          --test application_client_bundle
          --test application_client_fixture
          --test installed_current_process
          -- -D warnings

  copilot-fallback:
    name: Copilot fallback E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Exercise generated fallback launcher
        run: cargo test --no-default-features --features sqlite --test daemon_process_sqlite copilot_fallback

  feature-check:
    name: Feature combinations build
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux TLS dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build sqlite-only
        run: cargo build --no-default-features --features sqlite

      - name: Build postgres-only
        run: cargo build --no-default-features --features postgres

      - name: Build entra (Azure SDK)
        run: cargo build --features entra

      - name: Build default (all backends)
        run: cargo build

      - name: Build sqlite + self-update (lean self-updater combo)
        run: cargo build --no-default-features --features "sqlite,self-update"

      - name: Check supported Application Client consumer profiles
        run: |
          cargo check --manifest-path tests/fixtures/application-client-consumer/Cargo.toml --no-default-features --features sqlite
          cargo check --manifest-path tests/fixtures/application-client-consumer/Cargo.toml --no-default-features --features postgres
          cargo check --manifest-path tests/fixtures/application-client-consumer/Cargo.toml --no-default-features --features entra
          cargo check --manifest-path tests/fixtures/application-client-consumer/Cargo.toml --no-default-features --features "sqlite,postgres"
          cargo check --manifest-path tests/fixtures/application-client-consumer/Cargo.toml --no-default-features --features "sqlite,entra"

      - name: Consumer fixture stays free of private seams
        # The external fixture is a public-surface consumer stand-in. Compiling
        # it is not enough: assert it never names daemon, install, backend, IPC,
        # CLI, registry, or profile internals.
        run: |
          set -o pipefail
          if grep -REn 'telex::(daemon|daemon_ipc|daemon_bootstrap|install|backend|cli|commands|ipc|registry|profiles|config|session_watch|identity|release|output)\b' tests/fixtures/application-client-consumer/src; then
            echo "::error::the external consumer fixture reached a private/internal telex module"
            exit 1
          fi
          echo "ok: the consumer fixture uses only telex::application_client and telex::model"

      - name: Lint the external consumer fixture with warnings denied
        run: cargo clippy --manifest-path tests/fixtures/application-client-consumer/Cargo.toml --no-default-features --features sqlite --all-targets -- -D warnings

      - name: Release-upgrade fallback error when self-update is compiled out
        # A build without `self-update` must reject `telex upgrade` (no --from) with an
        # actionable error AND a non-zero exit. Assert both, so a regression where the stub
        # prints the message but returns Ok(0) fails CI instead of silently defeating fail-closed.
        run: |
          set -o pipefail
          if out="$(cargo run --no-default-features --features sqlite -- upgrade 2>&1)"; then
            echo "$out"
            echo "::error::compiled-out telex upgrade unexpectedly exited 0 (should fail closed)"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "compiled without release-upgrade support" || {
            echo "::error::sqlite-only build did not emit the compiled-out upgrade fallback error"
            exit 1
          }

      - name: Core stays lean (no TUI deps in `telex`)
        run: |
          if cargo tree -p telex -e normal | grep -Eq 'ratatui|crossterm'; then
            echo "ERROR: core telex crate pulled in a TUI dependency (ratatui/crossterm)"
            cargo tree -p telex -e normal | grep -E 'ratatui|crossterm'
            exit 1
          fi
          echo "ok: core telex has no ratatui/crossterm"

  postgres-live:
    name: Live Postgres parity tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Linux TLS dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Run live Postgres proof tests
        env:
          TELEX_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          TELEX_PG_REQUIRE: "1"
        run: cargo test --all-features --test conformance --test daemon_core_postgres

      - name: Run the Application Client battery and consumer fixtures on live Postgres
        # The same backend-neutral semantic battery as the SQLite leg, plus the
        # executable external consumer probes, against per-run and per-test
        # unique schemas. TELEX_PG_REQUIRE=1 makes a missing or empty URL a hard
        # failure, so this job can never pass by silently skipping Postgres.
        env:
          TELEX_PG_REQUIRE: "1"
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          export TELEX_PG_URL="postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          cargo test --all-features \
            --test application_client_conformance \
            --test application_client_fixture \
            -- --test-threads=1

      - name: Missing Postgres URL fails closed under TELEX_PG_REQUIRE
        # Proves the fail-closed guard itself: with TELEX_PG_REQUIRE=1 and no
        # URL the Postgres legs must fail rather than skip.
        env:
          TELEX_PG_REQUIRE: "1"
          TELEX_PG_URL: ""
        run: |
          set -o pipefail
          if cargo test --all-features --test application_client_conformance -- --test-threads=1 postgres_application_client_conformance; then
            echo "::error::TELEX_PG_REQUIRE=1 with no TELEX_PG_URL must fail, not skip"
            exit 1
          fi
          echo "ok: the Postgres Application Client leg fails closed without credentials"
