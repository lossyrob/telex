[package]
name = "telex-watcher"
version = "0.1.0"
edition = "2021"
description = "Trusted-local observational command runtime for Telex"
publish = false

[[bin]]
name = "telex-watcher"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
fs2 = "0.4"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "time", "sync", "signal"] }
uuid = { version = "1", features = ["v4"] }
telex = { path = "..", default-features = false }
serde_json_canonicalizer = "0.3"

[features]
default = ["sqlite", "postgres"]
sqlite = ["telex/sqlite"]
postgres = ["telex/postgres"]
entra = ["telex/entra"]

[dev-dependencies]
# Enables the paused/auto-advancing test clock used to prove reconcile backoff is bounded.
tokio = { version = "1", features = ["test-util"] }
toml = "0.8"
tokio-postgres = "0.7"
# Issue #209 pilot (non-merging): statement trace/profile hooks for test builds.
rusqlite = { version = "0.32", features = ["trace"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
